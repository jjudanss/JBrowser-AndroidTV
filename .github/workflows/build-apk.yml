
name: Build JBrowser Android TV APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build JBrowser APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build JBrowser
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
            dist/JBrowser-1.5.0-Android-TV.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JBrowser-1.5.0-Android-TV
          path: dist/JBrowser-1.5.0-Android-TV.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: JBrowser 1.5.0 for Android TV
          body: |
            JBrowser 1.5.0 for Android TV.

            Download the APK below and install it on your Android TV.
            This is a debug-signed test build.
          files: dist/JBrowser-1.5.0-Android-TV.apk
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
